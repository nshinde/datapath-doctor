[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapath-doctor"
version = "0.2.0"
description = "Evidence-based diagnostics for ML training data-path bottlenecks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Nilesh Shinde" }]
keywords = [
    "pytorch",
    "dataloader",
    "storage",
    "observability",
    "gpu",
    "ml-infrastructure",
    "diagnostics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
remote = ["fsspec>=2024.6"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/nshinde/datapath-doctor"
Repository = "https://github.com/nshinde/datapath-doctor"
Issues = "https://github.com/nshinde/datapath-doctor/issues"

[project.scripts]
datapath-doctor = "datapath_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
