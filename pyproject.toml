[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapath-doctor"
version = "0.1.0"
description = "Diagnostic engine for the storage / data-loading input path in ML training jobs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Nilesh Shinde" }]
keywords = [
    "pytorch",
    "dataloader",
    "storage",
    "observability",
    "gpu",
    "ml-infrastructure",
    "diagnostics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
datapath-doctor = "datapath_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
